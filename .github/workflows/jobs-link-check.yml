name: Jobs link check

# Weekly probe of every published /jobs offer URL. When an offer's link is dead
# for FAIL_THRESHOLD probes in a row the script flips its frontmatter status to
# `expired`; this workflow then opens a PR so Sara reviews before it goes live.
# Nothing is merged automatically.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch: {} # allow a manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  check-links:
    name: Probe offer links & open PR on change
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe job offer links
        id: probe
        working-directory: ngdigest-front
        run: node scripts/check-jobs-links.mjs

      - name: Open PR if statuses changed
        if: steps.probe.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: bot/jobs-link-health
          delete-branch: true
          add-paths: ngdigest-front/src/content/jobs/*.md
          commit-message: 'chore(jobs): auto-expire offers with dead links'
          title: 'chore(jobs): dead-link check — review auto-expired offers'
          labels: |
            automated
            jobs
          body: |
            ## Automated dead-link check

            The weekly link monitor flipped one or more offers to `expired`
            after **two consecutive dead probes** (404/410 or unreachable).
            Bot-blocks and server hiccups (401/403/429/5xx) never trigger this.

            - Review the diff and confirm each offer is genuinely gone.
            - If an offer is actually still live (e.g. a temporary outage),
              set its `status` back to `active` before merging.
            - Merge to publish the expirations.

            _Generated by `scripts/check-jobs-links.mjs` · see
            `.github/workflows/jobs-link-check.yml`._
