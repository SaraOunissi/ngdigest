name: Dependencies
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: python .engineering/security.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: .engineering/artifacts/security/
          retention-days: 14
