<div class="filter-bar">
  @for (filter of filters; track filter.value) {
    <button
      class="filter-bar__btn"
      [class.filter-bar__btn--active]="activeFilter() === filter.value"
      (click)="selectFilter(filter.value)"
      type="button"
    >
      {{ filter.labelKey | translate }}
    </button>
  }
</div>
