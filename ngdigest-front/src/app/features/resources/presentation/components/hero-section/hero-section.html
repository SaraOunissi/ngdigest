<section class="hero">
  <div class="hero__content">
    <h1 class="hero__title">NgDigest</h1>
    <p class="hero__subtitle">{{ 'hero.subtitle' | translate }}</p>
    <div class="hero__search">
      <input
        class="hero__search-input"
        type="search"
        [placeholder]="'hero.searchPlaceholder' | translate"
        [attr.aria-label]="'hero.searchLabel' | translate"
        [value]="searchValue()"
        (input)="searchValue.set($any($event.target).value)"
      />
      @if (searchValue()) {
        <button
          class="hero__search-clear"
          type="button"
          [attr.aria-label]="'hero.clearSearch' | translate"
          (click)="searchValue.set('')"
        >×</button>
      }
    </div>
  </div>
</section>
